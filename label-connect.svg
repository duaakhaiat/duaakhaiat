<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 64" width="1000" height="64"><defs>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
<linearGradient id="trail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5ce1ff" stop-opacity="0"/><stop offset="0.5" stop-color="#5ce1ff" stop-opacity="0.8"/><stop offset="1" stop-color="#5ce1ff" stop-opacity="0"/></linearGradient>
</defs><rect width="1000" height="64" fill="#0b1030"/>
<text x="40" y="38" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="6" fill="#5ce1ff">SEND A SIGNAL</text>
<line x1="196" y1="33" x2="960" y2="33" stroke="url(#rule)" stroke-width="1.5"/>
<circle r="3" fill="#fff" filter="url(#glow)"><animateMotion dur="4s" repeatCount="indefinite" path="M196,33 L960,33"/></circle></svg>