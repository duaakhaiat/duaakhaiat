<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="180" viewBox="0 0 1000 180" role="img" aria-labelledby="title description">
  <title id="title">GitHub profile statistics</title>
  <desc id="description">Four repository statistics on animated dark cards. Private statistics are not connected.</desc>
  <rect width="1000" height="180" rx="18" fill="#0b1020" stroke="#293452" />
  <text x="500" y="26" text-anchor="middle" fill="#aeb7d4" font-family="monospace" font-size="10" letter-spacing="3">GITHUB SNAPSHOT</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <g>
      <rect x="20" y="40" width="230" height="94" rx="14" fill="#111a35" stroke="#293452" />
      <rect x="21" y="41" width="228" height="2" rx="1" fill="#71ddff">
        <animate attributeName="opacity" values=".25;.85;.25" dur="4s" repeatCount="indefinite" />
      </rect>
      <text x="135" y="91" text-anchor="middle" fill="#f8fafc" font-size="34" font-weight="bold">4</text>
      <text x="135" y="116" text-anchor="middle" fill="#71ddff" font-family="monospace" font-size="10" letter-spacing="1.5">PUBLIC REPOS</text>
    </g>
    <g>
      <rect x="265" y="40" width="230" height="94" rx="14" fill="#111a35" stroke="#293452" />
      <rect x="266" y="41" width="228" height="2" rx="1" fill="#a78bfa">
        <animate attributeName="opacity" values=".25;.85;.25" dur="4s" begin=".45s" repeatCount="indefinite" />
      </rect>
      <text x="380" y="91" text-anchor="middle" fill="#f8fafc" font-size="34" font-weight="bold">0</text>
      <text x="380" y="116" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="10" letter-spacing="1.5">STARS</text>
    </g>
    <g>
      <rect x="510" y="40" width="230" height="94" rx="14" fill="#111a35" stroke="#293452" />
      <rect x="511" y="41" width="228" height="2" rx="1" fill="#f0abfc">
        <animate attributeName="opacity" values=".25;.85;.25" dur="4s" begin=".9s" repeatCount="indefinite" />
      </rect>
      <text x="625" y="91" text-anchor="middle" fill="#f8fafc" font-size="34" font-weight="bold">0</text>
      <text x="625" y="116" text-anchor="middle" fill="#f0abfc" font-family="monospace" font-size="10" letter-spacing="1.5">FORKS</text>
    </g>
    <g>
      <rect x="755" y="40" width="230" height="94" rx="14" fill="#111a35" stroke="#293452" />
      <rect x="756" y="41" width="228" height="2" rx="1" fill="#57e0bd">
        <animate attributeName="opacity" values=".25;.85;.25" dur="4s" begin="1.35s" repeatCount="indefinite" />
      </rect>
      <text x="870" y="91" text-anchor="middle" fill="#f8fafc" font-size="34" font-weight="bold">&#8212;</text>
      <text x="870" y="116" text-anchor="middle" fill="#57e0bd" font-family="monospace" font-size="10" letter-spacing="1.5">PRIVATE · NOT CONNECTED</text>
    </g>
  </g>

  <text x="500" y="160" text-anchor="middle" fill="#7f8aaa" font-family="monospace" font-size="10">Public snapshot · 2026-10-06 · Private metrics not connected</text>
</svg>
