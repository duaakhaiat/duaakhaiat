<svg xmlns="http://www.w3.org/2000/svg" width="480" height="190" viewBox="0 0 480 190" role="img" aria-labelledby="title description">
  <title id="title">DeblurLab</title>
  <desc id="description">Image restoration playground with blur simulation and Wiener deconvolution.</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#0969da" />
      <stop offset=".55" stop-color="#8250df" />
      <stop offset="1" stop-color="#bf3989" />
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="478" height="188" rx="16" fill="#ffffff" stroke="#d0d7de" />
  <path d="M17 2H463" stroke="url(#edge)" stroke-width="3" stroke-linecap="round">
    <animate attributeName="opacity" values=".35;1;.35" dur="4s" repeatCount="indefinite" />
  </path>
  <g transform="translate(24 35)">
    <rect width="54" height="54" rx="15" fill="#ddf4ff" />
    <path d="M12 37 25 23l8 8 9-12" fill="none" stroke="#0969da" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="25" cy="23" r="3" fill="#8250df">
      <animate attributeName="r" values="2;4;2" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <path d="M12 42h30" stroke="#7aaee8" stroke-width="2" stroke-linecap="round" />
  </g>
  <text x="96" y="52" fill="#57606a" font-family="monospace" font-size="10" letter-spacing="2">IMAGE RESTORATION</text>
  <text x="96" y="83" fill="#24292f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">DeblurLab</text>
  <text x="96" y="111" fill="#57606a" font-family="Arial, Helvetica, sans-serif" font-size="13">Blur simulation + Wiener deconvolution</text>
  <path d="M24 139H456" stroke="#d8dee4" />
  <text x="24" y="164" fill="#0969da" font-family="monospace" font-size="11">OPEN REPOSITORY</text>
  <path d="M431 158h20m-8-8 8 8-8 8" fill="none" stroke="#8250df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="1.8s" repeatCount="indefinite" />
  </path>
</svg>
